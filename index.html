<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf9f4">
<title>english-850</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<div class="app">

  <div class="hdr">
    <span class="idx" id="idx">1 / 3</span>
    <span class="eta" id="eta">约 4 分钟学完</span>
    <button class="me" id="btn-me" type="button" aria-label="我的">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="8.5" r="3.4"/>
        <path d="M5.2 19.5c0-3.6 3-6.2 6.8-6.2s6.8 2.6 6.8 6.2"/>
      </svg>
    </button>
  </div>

  <div class="warn" id="warn" hidden>
    当前环境不能保存数据，刷新后会丢。用浏览器直接打开 index.html 就正常。
  </div>

  <div class="pages" id="pages"></div>

  <div class="dots" id="dots"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-hdr">
      <h2>我的</h2>
      <button class="close" id="btn-close" type="button" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body">
      <div class="big-stats">
        <div><b id="stat-days">0</b><span>累计天数</span></div>
        <div><b id="stat-min">0</b><span>累计分钟</span></div>
      </div>

      <div class="cal-wrap" id="cal-wrap">
        <div class="cal-months" id="heat"></div>
      </div>

      <div class="rows">
        <button class="row-link" data-list="save" type="button">
          收藏的内容<b id="n-save">0</b>
        </button>
        <button class="row-link" data-list="like" type="button">
          点过赞的内容<b id="n-like">0</b>
        </button>
        <button class="row-link" data-list="word" type="button">
          收藏的词<b id="n-word">0</b>
        </button>
        <button class="row-link" id="row-mode" type="button">
          练习模式<b id="mode-state">关</b>
        </button>
      </div>
    </div>

    <div class="sub" id="sub">
      <div class="sheet-hdr">
        <h2 id="sub-title">列表</h2>
        <button class="close" id="sub-close" type="button" aria-label="返回">×</button>
      </div>
      <div class="sheet-body" id="sub-body"></div>
    </div>
  </div>

</div>

<script src="data/words.js?v=5"></script>
<script src="data/units.js?v=5"></script>
<script src="data/extras.js?v=5"></script>
<script src="js/store.js?v=5"></script>
<script src="js/reader.js?v=5"></script>
<script src="js/actions.js?v=5"></script>
<script src="js/progress.js?v=5"></script>
<script src="js/extras.js?v=5"></script>
<script src="js/app.js?v=5"></script>
<script src="js/dev.js?v=5"></script>
</body>
</html>
